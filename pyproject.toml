[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "researchatlas"
dynamic = ["version"]
description = "Mine coding-agent transcripts (Codex, Claude Code, Copilot) into a verified, cited research knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Benedict Davon" }]
keywords = ["coding-agents", "knowledge-base", "transcripts", "research-data", "claude-code", "codex", "copilot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/benedictdavon/ResearchAtlas"
Issues = "https://github.com/benedictdavon/ResearchAtlas/issues"

[project.scripts]
researchatlas = "atlaslib.cli:main"

[tool.setuptools]
packages = ["atlaslib", "atlaslib.sources"]

[tool.setuptools.package-data]
atlaslib = ["config.example.toml"]

[tool.setuptools.dynamic]
version = { attr = "atlaslib.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["atlaslib"]
