name: Feature request
description: Suggest an improvement or a new transcript source
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like to happen. Check docs/roadmap.md first; it may already list the idea and its trigger.
