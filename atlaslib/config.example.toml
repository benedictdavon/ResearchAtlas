# ResearchAtlas configuration, created by `researchatlas init`. Edit the paths below to match your machine.
# Paths may start with ~. work_dir, knowledge_dir, review_ledger and chat_storage may be relative: they
# resolve against the folder that holds this file (the atlas home). Every [sources] key is optional:
# a missing key disables that source.

[sources]
codex_sessions = "~/.codex/sessions"
codex_session_index = "~/.codex/session_index.jsonl"
claude_projects = "~/.claude/projects"

# GitHub Copilot (D22). chat_storage: per-workspace mirror written by `researchatlas import-copilot` (D24).
# chat_dirs: manually exported VS Code Chat panel logs, with the workspace folder they came from.
# agent_state: Copilot agent sessions. vscode_storage: server-side Chat transcripts (ephemeral).
# workspace_cwd: folder for a workspace hash that has no workspace.json.
[sources.copilot]
chat_storage = "work/copilot_import/workspaceStorage"
chat_dirs = [
  # { path = "~/copilot_export/chatSessions", cwd = "~/research/demo_project" },
]
agent_state = "~/.copilot/session-state"
vscode_storage = "~/.vscode-server/data/User/workspaceStorage"
workspace_cwd = {}

[project]
name = "demo_project"
work_dir = "work/demo_project"                      # relative to the atlas home; generated
knowledge_dir = "projects/demo_project/knowledge"   # relative to the atlas home; the curated knowledge base
# A session is selected if its cwd is under one of these roots, or if its text mentions one of them ...
roots = [
  "~/research/demo_project",
]
# ... or if its cwd is under one of these (selection by cwd only) ...
cwd_also = ["~/research"]
# ... or if it is a subagent or fork of a selected session. Sessions under these cwds are never selected (D16).
exclude_cwd = ["~/.researchatlas"]
# Session ids or id prefixes to skip (e.g. sessions that only tested the atlas); their subagents/forks too (D20).
exclude_ids = []

[paths]
# Absolute paths under these prefixes are harvested from transcripts and verified against disk.
roots = [
  "/mnt/data",
  "~/research",
]
verify_timeout_s = 5      # per-path stat timeout; network mounts can hang
max_session_ids = 20

[limits]
# Truncation (chars) for the condensed transcripts.
user_text = 8000
agent_final = 40000
agent_commentary = 2000
tool_input = 400
subagent_result = 3000

[knowledge]
# Path abbreviations used inside knowledge/*.md (expanded when refresh re-verifies cited paths).
abbreviations = { DP = "~/research/demo_project" }
# refresh reports new paths not cited in knowledge/ that were used in at least this many sessions.
new_path_min_sessions = 1
